<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Drift</title>
<!-- Telegram Mini App: al alojarlo en tu web este script activa la integración -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--bg:#07030f;--ink:#f4eeff;--mute:#9a8bc0;--cy:#00f0ff;--mg:#ff2bd6;--am:#ffb020;--line:#3a2470;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;font-weight:500;overflow:hidden;touch-action:none;user-select:none}
#stage{position:relative;height:100%;width:100%;max-width:480px;margin:0 auto;overflow:hidden}
canvas{display:block;position:absolute;inset:0}
.hide{display:none!important}
#hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#sc{font:900 40px Orbitron,sans-serif;text-shadow:0 0 18px var(--cy);line-height:1}
#cn{font:700 20px Rajdhani,sans-serif;color:var(--am);text-shadow:0 0 10px var(--am)}
#lv{position:absolute;top:30%;left:0;right:0;text-align:center;font:900 30px Orbitron,sans-serif;color:var(--mg);text-shadow:0 0 24px var(--mg);opacity:0;pointer-events:none}
#lv.go{animation:lv 1.4s ease-out}
@keyframes lv{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(7,3,15,.72)}
#menu{background:transparent;justify-content:flex-start;padding-top:10vh}
h1{margin:0;font:900 clamp(44px,15vw,68px)/.95 Orbitron,sans-serif;background:linear-gradient(100deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,43,214,.55));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 34px rgba(0,240,255,.7))}}
h2{margin:0;font:900 30px Orbitron,sans-serif}
.sub{color:var(--mute);font-size:18px;margin:0}
.big{font:900 54px Orbitron,sans-serif;text-shadow:0 0 20px var(--cy)}
.b{font:700 20px Rajdhani,sans-serif;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:14px;padding:12px 22px;min-width:240px;cursor:pointer;transition:transform .12s,border-color .12s}
.b:hover{border-color:var(--cy)}.b:active{transform:scale(.97)}
.b:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.b.p{border:0;background:linear-gradient(100deg,var(--cy),var(--mg));color:#0a0418;box-shadow:0 0 26px rgba(255,43,214,.45);font-size:24px}
.b.r{border-color:var(--am);color:var(--am)}
.b:disabled{opacity:.5;cursor:default}
#bn{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:320px;max-width:94%;height:50px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px}
#list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
.sk{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left}
.sk.on{border-color:var(--cy)}
.sk span{flex:1;font-size:19px;font-weight:700}
.sk .b{min-width:0;padding:6px 14px;font-size:16px}
.ad{width:280px;height:170px;border-radius:14px;background:repeating-linear-gradient(45deg,#1b0d3a,#1b0d3a 14px,#24124d 14px,#24124d 28px);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:18px}
#ad{background:rgba(7,3,15,.94);z-index:9}
.row{display:flex;gap:10px;width:240px}.row .b{min-width:0;flex:1;padding:10px 8px;font-size:18px}#pw{position:absolute;top:70px;left:0;right:0;text-align:center;font:700 20px Rajdhani,sans-serif;pointer-events:none}#rl{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}.sk b{font:900 18px Orbitron,sans-serif}
@media (prefers-reduced-motion:reduce){h1,#lv.go{animation:none}}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<div id="hud" class="hide"><span id="sc">0</span><span id="cn">◆ 0</span></div>
<div id="lv"></div><div id="pw"></div>

<div id="menu" class="ov">
  <h1>Neon<br>Drift</h1>
  <p class="sub" id="mb"></p><p class="sub" id="ch" style="color:var(--am)"></p>
  <div style="height:3vh"></div>
  <button class="b r" id="bdaily">Recompensa diaria</button>
  <button class="b p" id="bplay">Jugar</button>
  <button class="b" id="bshop">Tienda de naves</button>
  <div class="row"><button class="b" id="brank">Ranking</button><button class="b" id="bsnd">Sonido: sí</button></div>
  <p class="sub">Arrastra el dedo o usa ← →</p>
  <div id="bn">Banner 320×50 (espacio para anuncio)</div>
</div>

<div id="rank" class="ov hide"><h2>Ranking</h2><p class="sub">Tus mejores partidas en este dispositivo</p><div id="rl"></div><button class="b" id="brb">Volver</button></div>

<div id="shop" class="ov hide">
  <h2>Tienda</h2>
  <p class="sub" id="sm"></p>
  <div id="list"></div>
  <button class="b r" id="bfree">Ver anuncio: +25 monedas</button>
  <button class="b" id="bback">Volver</button>
</div>

<div id="over" class="ov hide">
  <h2>Has chocado</h2>
  <div class="big" id="os">0</div>
  <p class="sub" id="om"></p>
  <button class="b r" id="brev">Revivir (ver anuncio)</button>
  <button class="b r" id="bdbl">Duplicar monedas (ver anuncio)</button>
  <button class="b" id="bshare">Retar a un amigo</button>
  <button class="b p" id="bagain">Jugar otra vez</button>
  <button class="b" id="bmenu">Menú</button>
</div>

<div id="ad" class="ov hide">
  <div class="ad" id="adt">Anuncio simulado</div>
  <p class="sub" id="adm"></p>
  <button class="b p" id="adx" disabled>Espera</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a);
const cv=$('c'),ctx=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const SK=[{n:'Pulso',c:'#00f0ff',p:0},{n:'Ámbar',c:'#ffb020',p:60},{n:'Magenta',c:'#ff2bd6',p:120},{n:'Lima',c:'#9dff3a',p:200}];
let S={best:0,coins:0,skin:0,own:[0],games:0,top:[],day:'',streak:0,mute:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('nd1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nd1',JSON.stringify(S))}catch(e){}};
/* ===== TELEGRAM ===== */
const TG=window.Telegram&&Telegram.WebApp;
const BOT='https://t.me/DokiJorBot/neondrift'; // <-- pon aquí el enlace de tu Mini App (te lo da @BotFather)
let ME='Jugador';
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#07030f');TG.setBackgroundColor('#07030f');TG.disableVerticalSwipes&&TG.disableVerticalSwipes();ME=(TG.initDataUnsafe.user||{}).first_name||ME}catch(e){}}
const buzz=t=>{try{TG&&TG.HapticFeedback.impactOccurred(t)}catch(e){}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function share(){const u=BOT+'?startapp=r_'+Math.floor(score)+'_'+(ME.replace(/[^A-Za-z0-9]/g,'').slice(0,12)||'amigo'),t='¡Supera mis '+Math.floor(score)+' puntos en Neon Drift! 🚀',l='https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t);TG?TG.openTelegramLink(l):window.open(l,'_blank')}
/* ===== SONIDO ===== */
let AC,mute=!!S.mute;
function snd(f,d,type,v,sl){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
const nextStreak=()=>S.day===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;

/* ===== ANUNCIOS =====
   Ahora son simulados. Para cobrar de verdad, sustituye el cuerpo de
   Ads.rewarded / Ads.interstitial / Ads.banner por la llamada de tu red
   (Adsgram o Monetag para Mini Apps de Telegram; Adsgram: new Adsgram({blockId}).show().then(cb)) y ejecuta cb() al terminar el anuncio. */
const Ads={
  rewarded(cb){sim('Anuncio con recompensa (simulado)',5,cb,true)},   // <-- CONECTA AQUÍ el anuncio recompensado
  interstitial(cb){sim('Anuncio intersticial (simulado)',3,cb,false)}, // <-- CONECTA AQUÍ el intersticial
  banner(el){/* <-- CONECTA AQUÍ el banner: monta tu anuncio dentro de #bn */}
};
function sim(t,sec,cb,rw){
  const a=$('ad'),b=$('adx');let n=sec;
  a.classList.remove('hide');$('adt').textContent=t;
  $('adm').textContent=rw?'Mira el anuncio completo para recibir tu recompensa.':'El juego continúa en unos segundos.';
  b.disabled=true;b.textContent='Espera '+n+' s';
  const iv=setInterval(()=>{n--;if(n>0)b.textContent='Espera '+n+' s';else{clearInterval(iv);b.disabled=false;b.textContent=rw?'Reclamar recompensa':'Cerrar anuncio'}},1000);
  b.onclick=()=>{a.classList.add('hide');cb()};
}
Ads.banner($('bn'));

/* ===== JUEGO ===== */
let W,H,dpr,st='menu',ob=[],cr=[],pu=[],pw={s:0,m:0,t:0},runId=0,beat=0,bi=0,pt=[],stars=[],score=0,run=0,speed=260,tm=0,acc=0,shake=0,inv=0,revived=false,doubled=false,sx=0,tx=0,go=0,hue=190,lvl=0,last=0,adGame=-1;
const keys={},SY=()=>H*.8,SP=250;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.min(innerWidth,480);H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);sx=tx=sx||W/2}
addEventListener('resize',resize);resize();
for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),z:R(.2,1)});

function view(id){['menu','shop','over','rank'].forEach(k=>$(k).classList.toggle('hide',k!==id));$('hud').classList.toggle('hide',id!==null)}
function refresh(){$('mb').textContent=ME+' · Récord '+S.best+' · ◆ '+S.coins;$('bdaily').classList.toggle('hide',S.day===new Date().toDateString());$('bdaily').textContent='Recompensa diaria: +'+Math.min(60,10*nextStreak());$('bsnd').textContent=mute?'Sonido: no':'Sonido: sí';$('sm').textContent='Tus monedas: ◆ '+S.coins}
function start(){ob=[];cr=[];pu=[];pw={s:0,m:0,t:0};runId=Date.now();pt=[];score=0;run=0;tm=0;acc=0;speed=260;lvl=0;revived=false;doubled=false;inv=1.2;sx=tx=W/2;st='play';$('cn').textContent='◆ 0';$('sc').textContent='0';view(null)}
function cx(b){return Math.max(b.gw/2+14,Math.min(W-b.gw/2-14,b.gx+Math.sin(tm*2+b.ph)*b.amp))}
function burst(x,y,c,n,v){for(let i=0;i<n;i++){const a=R(0,6.283),s=R(.2,1)*v;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.9),m:.9,c})}}
function die(){
  shake=RM?0:18;snd(220,.6,'sawtooth',.12,40);buzz('heavy');burst(sx,SY(),SK[S.skin].c,60,320);burst(sx,SY(),'#fff',20,200);st='over';
  if(!revived)S.games++;S.coins+=run;S.best=Math.max(S.best,Math.floor(score));S.top=S.top.filter(e=>e.r!==runId).concat({n:ME,s:Math.floor(score),r:runId}).sort((a,b)=>b.s-a.s).slice(0,10);save();
  setTimeout(()=>{if(st!=='over')return;$('os').textContent=Math.floor(score);
    $('om').textContent='Récord '+S.best+' · +'+run+' monedas';
    $('brev').classList.toggle('hide',revived);$('bdbl').classList.toggle('hide',doubled||run<1);view('over')},650);
}
function up(dt){
  gridOffs+=dt*(st==='play'?speed/95:.5);
  stars.forEach(s=>{s.y+=dt*s.z*(st==='play'?speed/900:.05);if(s.y>1){s.y=0;s.x=Math.random()}});
  pt=pt.filter(p=>(p.l-=dt)>0);pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt});
  shake=Math.max(0,shake-dt*40);
  hue+=((190+lvl*47)-hue)*Math.min(1,dt*2);
  if(st==='menu'){sx=W/2+Math.sin(performance.now()/700)*60;return}
  if(st!=='play')return;
  pw.m=Math.max(0,pw.m-dt);pw.t=Math.max(0,pw.t-dt);if(pw.t>0)dt*=.55;tm+=dt;inv=Math.max(0,inv-dt);beat+=dt;if(beat>.22){beat=0;bi=(bi+1)%8;snd([55,55,82,73,55,55,98,82][bi],.2,'sawtooth',.035)}
  speed=Math.min(720,260+tm*9);score+=speed*dt/40;
  const nl=Math.floor(score/250);
  if(nl>lvl){lvl=nl;const e=$('lv');e.textContent='Nivel '+(lvl+1);e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
  if(keys.ArrowLeft||keys.a)tx-=520*dt;if(keys.ArrowRight||keys.d)tx+=520*dt;
  tx=Math.max(14,Math.min(W-14,tx));sx+=(tx-sx)*Math.min(1,dt*16);
  acc+=speed*dt;
  if(acc>SP){acc=0;const gw=Math.max(112,190-lvl*9),amp=lvl>=2?Math.min(46,(lvl-1)*11):0;
    ob.push({y:-24,h:22,gw,amp,ph:R(0,6.28),gx:R(gw/2+14+amp,W-gw/2-14-amp)});
    const q=Math.random();if(q<.16)pu.push({x:R(36,W-36),y:-24-SP/2,k:['s','m','t'][Math.floor(R(0,3))]});else if(q<.8)cr.push({x:R(36,W-36),y:-24-SP/2,r:R(0,6)})}
  const sy=SY();
  ob.forEach(b=>{b.y+=speed*dt;
    if(!inv&&b.y+b.h>sy-12&&b.y<sy+12){const g=cx(b);if(sx-9<g-b.gw/2||sx+9>g+b.gw/2){if(pw.s){pw.s=0;inv=1.2;shake=RM?0:8;burst(sx,sy,'#00f0ff',30,260);snd(140,.3,'sawtooth',.1,60);buzz('medium')}else die()}}});
  cr.forEach(c=>{c.y+=speed*dt;c.r+=dt*3;if(pw.m>0&&Math.hypot(c.x-sx,c.y-sy)<190)c.x+=(sx-c.x)*Math.min(1,dt*6);
    if(!c.d&&Math.hypot(c.x-sx,c.y-sy)<24){c.d=1;run++;score+=10;$('cn').textContent='◆ '+run;burst(c.x,c.y,'#ffb020',14,180);snd(880,.12,'triangle',.08,1320);buzz('light')}});
  pu.forEach(p=>{p.y+=speed*dt;if(!p.d&&Math.hypot(p.x-sx,p.y-sy)<26){p.d=1;if(p.k==='s')pw.s=1;else if(p.k==='m')pw.m=8;else pw.t=5;burst(p.x,p.y,'#fff',18,220);snd(440,.25,'square',.06,880);buzz('medium')}});pu=pu.filter(p=>!p.d&&p.y<H+40);
  ob=ob.filter(b=>b.y<H+40);cr=cr.filter(c=>!c.d&&c.y<H+40);
  if(st==='play'){pt.push({x:sx+R(-4,4),y:sy+14,vx:R(-20,20),vy:speed*.45,l:.4,m:.4,c:SK[S.skin].c});$('sc').textContent=Math.floor(score);$('pw').textContent=(pw.s?'🛡 ':'')+(pw.m>0?'🧲'+Math.ceil(pw.m)+' ':'')+(pw.t>0?'⏳'+Math.ceil(pw.t):'')}
}
let gridOffs=0;
function draw(){
  ctx.save();ctx.clearRect(0,0,W,H);
  if(shake)ctx.translate(R(-1,1)*shake,R(-1,1)*shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07030f');g.addColorStop(.45,`hsl(${hue+70},70%,12%)`);g.addColorStop(1,'#07030f');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  stars.forEach(s=>{ctx.globalAlpha=s.z*.8;ctx.fillStyle='#fff';ctx.fillRect(s.x*W,s.y*H*.6,s.z*2,s.z*2)});
  ctx.globalAlpha=1;
  const hy=H*.3;ctx.lineWidth=1.5;ctx.strokeStyle=`hsl(${hue},100%,60%)`;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=8;
  for(let i=0;i<14;i++){const p=((i+gridOffs)%14)/14,y=hy+(H-hy)*p*p;ctx.globalAlpha=.15+p*.6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.globalAlpha=.35;for(let k=-9;k<=9;k++){ctx.beginPath();ctx.moveTo(W/2+k*8,hy);ctx.lineTo(W/2+k*W*.32,H);ctx.stroke()}
  ctx.globalAlpha=1;
  const col=`hsl(${hue+150},100%,62%)`;
  ob.forEach(b=>{const c=cx(b),l=c-b.gw/2,r=c+b.gw/2;ctx.shadowColor=col;ctx.shadowBlur=22;ctx.fillStyle=col;
    ctx.fillRect(-10,b.y,l+10,b.h);ctx.fillRect(r,b.y,W-r+10,b.h);
    ctx.fillStyle='#fff';ctx.fillRect(l-4,b.y,4,b.h);ctx.fillRect(r,b.y,4,b.h)});
  cr.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.shadowColor='#ffb020';ctx.shadowBlur=18;ctx.fillStyle='#ffd27a';
    ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,0);ctx.lineTo(0,11);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();ctx.restore()});
  pu.forEach(p=>{const c={s:'#00f0ff',m:'#ffb020',t:'#ff2bd6'}[p.k];ctx.shadowColor=c;ctx.shadowBlur=18;ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,13,0,6.283);ctx.stroke();ctx.fillStyle=c;ctx.font='700 14px Rajdhani';ctx.textAlign='center';ctx.fillText({s:'S',m:'M',t:'T'}[p.k],p.x,p.y+5)});
  ctx.globalCompositeOperation='lighter';
  pt.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=10;ctx.fillRect(p.x-2,p.y-2,4,4)});
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(st!=='over'&&!(inv>0&&Math.floor(inv*12)%2)){const c=SK[S.skin].c,y=st==='menu'?SY():SY();
    ctx.shadowColor=c;ctx.shadowBlur=24;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(sx,y-17);ctx.lineTo(sx-12,y+13);ctx.lineTo(sx,y+7);ctx.lineTo(sx+12,y+13);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(sx,y-8);ctx.lineTo(sx-3,y+3);ctx.lineTo(sx+3,y+3);ctx.fill();if(pw.s&&st==='play'){ctx.shadowColor='#00f0ff';ctx.shadowBlur=16;ctx.strokeStyle='#00f0ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(sx,y,24,0,6.283);ctx.stroke()}}
  ctx.restore();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;up(dt);draw();requestAnimationFrame(loop)}

/* ===== ENTRADA ===== */
const stage=$('stage');
function pos(e){if(st==='play')tx=e.clientX-stage.getBoundingClientRect().left}
stage.addEventListener('pointerdown',pos);stage.addEventListener('pointermove',pos);
addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);

/* ===== INTERFAZ ===== */
function shopUI(){
  refresh();const L=$('list');L.innerHTML='';
  SK.forEach((s,i)=>{const own=S.own.includes(i),d=document.createElement('div');d.className='sk'+(S.skin===i?' on':'');
    d.innerHTML=`<svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 3 L4 27 L15 21 L26 27Z" fill="${s.c}" style="filter:drop-shadow(0 0 5px ${s.c})"/></svg><span>${s.n}</span>`;
    const b=document.createElement('button');b.className='b';
    b.textContent=own?(S.skin===i?'Equipada':'Equipar'):'◆ '+s.p;b.disabled=S.skin===i||(!own&&S.coins<s.p);
    b.onclick=()=>{if(!own){S.coins-=s.p;S.own.push(i)}S.skin=i;save();shopUI()};d.appendChild(b);L.appendChild(d)});
}
$('bplay').onclick=start;
$('bshop').onclick=()=>{shopUI();view('shop')};
$('bback').onclick=()=>{refresh();view('menu')};
$('bfree').onclick=()=>Ads.rewarded(()=>{S.coins+=25;save();shopUI()});
$('brev').onclick=()=>Ads.rewarded(()=>{revived=true;S.coins-=run;save();ob=ob.filter(b=>b.y<SY()-260);cr=[];inv=2.4;st='play';view(null)});
$('bdbl').onclick=()=>Ads.rewarded(()=>{doubled=true;S.coins+=run;save();$('om').textContent='Récord '+S.best+' · +'+run*2+' monedas';$('bdbl').classList.add('hide')});
$('bagain').onclick=()=>{if(S.games>0&&S.games%3===0&&adGame!==S.games){adGame=S.games;Ads.interstitial(start)}else start()};
$('bmenu').onclick=()=>{refresh();st='menu';view('menu')};
$('bdaily').onclick=()=>{const n=nextStreak();S.streak=n;S.day=new Date().toDateString();S.coins+=Math.min(60,10*n);save();snd(660,.3,'triangle',.08,1320);refresh()};
$('brank').onclick=()=>{const L=$('rl');L.innerHTML=S.top.length?'':'<p class="sub">Aún no hay partidas. ¡Juega la primera!</p>';S.top.forEach((e,i)=>{const d=document.createElement('div');d.className='sk'+(i===0?' on':'');d.innerHTML='<span>'+(i+1)+'. '+esc(e.n)+'</span><b>'+e.s+'</b>';L.appendChild(d)});view('rank')};
$('brb').onclick=()=>view('menu');
$('bsnd').onclick=()=>{mute=!mute;S.mute=mute;save();refresh()};
$('bshare').onclick=share;
try{const p=(TG&&TG.initDataUnsafe.start_param||'').split('_');if(p[0]==='r')$('ch').textContent='🏁 Reto de '+p[2]+': supera los '+p[1]+' puntos'}catch(e){}
refresh();view('menu');requestAnimationFrame(loop);
</script>
</body>
</html>
